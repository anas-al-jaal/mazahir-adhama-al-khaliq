if(p==0){h+=`<h3>التفسير المفصل</h3><p>${v[1]}</p><h3>المعاني الإيمانية والكونية والتربوية</h3><p>تدور الآية حول ${i<1?'صدق القرآن ووحدانية الله':i<7?'عظمة القدرة الإلهية والآيات الكونية':i<11?'سعة علم الله وإحاطته':i<16?'ظواهر الكون الدالة على وحدانية الله وخضوع الخلق له':'إقامة الحجة على وحدانية الله'}؛ فالمؤمن يتأمل الكون ليزداد إيمانًا، ويُعمل عقله فيما خلق الله.</p>
<div class="vis"><div class="card3d" title="اضغط للتدوير"><div><img src="${v[3]}" alt="${v[4]}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'display:grid;place-items:center;height:100%;color:var(--soft);font-size:14px;text-align:center;padding:10px\\'>${v[4]}</div>'"></div></div><p><b>العنصر البصري:</b> ${v[4]}<br>الصورة مستطيلة (16:9) وتغطي الإطار بالكامل.</p></div>`}
if(p==1){h+=`<h3>شرح المفردات والجداول اللغوية</h3><table><tr><th>الكلمة</th><th>معناها الدقيق</th><th>المضاد / الجمع / الأصل</th></tr>${v[2].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}
if(p==2){h+=`<h3>السؤال الإعرابي</h3><div class="q"><b>${v[5]}</b><br><button data-a>أظهر الإجابة</button><div class="ans"><b>الإجابة:</b> ${v[6]}</div></div>${v[7]?'<div class="note">الإعراب في هذه الآية اجتهاد نحوي أساسي لأنه لم يرد نصًّا في الملزمة — يُراجَع مع المعلّم أو كتب الإعراب.</div>':''}`}
return h+`</section>`}
function render(){
document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-current',i==cur));
$('#tabs').style.display=all?'none':'flex';
document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-current',i==pg));
$('#book').innerHTML=all?V.map((_,i)=>[0,1,2].map(p=>page(i,p)).join('')).join(''):page(cur,pg);
bind()}
function bind(){
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.classList.toggle('on');b.textContent=a.classList.contains('on')?'أخفِ الإجابة':'أظهر الإجابة'});
document.querySelectorAll('.card3d').forEach(c=>{const d=c.firstElementChild;c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;d.style.transform=`rotateY(${x*50}deg) rotateX(${-y*50}deg)`};c.onmouseleave=()=>d.style.transform='';c.onclick=()=>c.classList.toggle('f')})}
V.forEach((_,i)=>{const b=document.createElement('button');b.textContent=ar(i+1);b.title='الآية '+ar(i+1);b.onclick=()=>{cur=i;pg=0;all=false;render();scrollTo({top:0})};$('#nav').appendChild(b)});
T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{pg=i;render()};$('#tabs').appendChild(b)});
$('#all').onclick=()=>{all=!all;render();if(all)setTimeout(()=>print(),300)};
render();
</script>

const TT=['التفسير والشرح الموضوعي','المفردات والمعاني اللغوية','الإعراب النحوي والتحليل'];
const seen=new Set();
function tbl(h1,h2,rows){return `<table><tr><th>${h1}</th><th>${h2}</th></tr>${rows.map(r=>`<tr class="hl"><td class="w">${r[0]}</td><td>${r[1]||''}</td></tr>`).join('')}</table>`}
function page(i,p){const v=V[i],e=E[i];let h=`<section class="page">`+head(i,p,TT[p]);
if(p==0){h+=`<h3>التفسير المفصل</h3><p>${v[1].split('<br><b>')[0]}</p><h3>المعاني الإيمانية والكونية والتربوية</h3><p>تدور الآية حول ${i<1?'صدق القرآن ووحدانية الله':i<7?'عظمة القدرة الإلهية والآيات الكونية':i<11?'سعة علم الله وإحاطته':i<16?'ظواهر الكون الدالة على وحدانية الله وخضوع الخلق له':'إقامة الحجة على وحدانية الله'}؛ فالمؤمن يتأمل الكون ليزداد إيمانًا، ويُعمل عقله فيما خلق الله.</p><h3>الصور الجمالية والدلالات</h3><div class="sec">${P(e[3]).map(b=>`<details><summary>${b[0]}</summary><p>${b[1]}</p></details>`).join('')}</div><div class="vis" style="justify-content:center"><div class="card3d" title="اضغط للتدوير"><div><img src="${v[3]}" alt="${v[4]}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'display:grid;place-items:center;height:100%;color:var(--soft);font-size:14px;text-align:center;padding:10px\\'>${v[4]}</div>'"></div></div></div>`}
if(p==1){h+=`<h3>١ الكلمة ومرادفها</h3>${tbl('الكلمة','مرادفها / معناها',P(e[0]))}<h3>٢ الكلمة ومضادها</h3>${tbl('الكلمة','مضادها',P(e[1]))}<h3>٣ الكلمة وجمعها</h3>${tbl('المفرد','جمعه',P(e[2]))}`}
if(p==2){const r=P(e[4]);h+=`<h3>الجملة المطلوب إعرابها</h3><div class="sent">${r[0][0]}</div><p>أعرب الجملة كلمة كلمة ثم بيّن موقع الجملة إن كانت لها محل. اضغط على الإعراب لإظهاره في وضع التدريب.</p><h3>الإعراب المفصل</h3>${tbl('الكلمة','إعرابها',r.slice(1))}`}
return h+`</section>`}
function render(){seen.add(cur);
document.querySelectorAll('#nav button').forEach((b,i)=>{b.setAttribute('aria-current',i==cur);b.classList.toggle('seen',seen.has(i))});
$('#tabs').style.display=all?'none':'flex';
document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-current',i==pg));
$('#m1').setAttribute('aria-pressed',!all);$('#all').setAttribute('aria-pressed',all);
$('#pbar').style.width=seen.size/16*100+'%';
$('#book').innerHTML=all?V.map((_,i)=>[0,1,2].map(p=>page(i,p)).join('')).join(''):page(cur,pg);
bind();
document.querySelectorAll('td+td').forEach(td=>td.onclick=()=>td.classList.toggle('on'))}
$('#m1').onclick=()=>{all=false;render()};$('#all').onclick=()=>{all=true;render()};
$('#drill').onclick=e=>{const on=document.body.classList.toggle('drill');e.target.setAttribute('aria-pressed',on)};
addEventListener('keydown',e=>{if(all)return;if(e.key=='ArrowLeft'&&cur<15){cur++;pg=0;render()}if(e.key=='ArrowRight'&&cur>0){cur--;pg=0;render()}});
render();
</script>
<style>
/* ===================== وضع الكتاب ===================== */
.seg #bkb{border-inline-start:1px solid var(--latte)}

@media (max-width:899px){.bkarr{display:none}.bkt{font-size:17px}}

.bk{position:relative;height:var(--ph);width:calc(var(--pw)*2);perspective:calc(var(--pw)*5);transition:transform .9s cubic-bezier(.45,.05,.55,.95)}
.bk.one{width:var(--pw)}
.stk{position:absolute;top:4px;height:var(--ph);border-radius:8px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,var(--paper) 1px 3px);box-shadow:0 18px 38px var(--shadow);transition:left .9s,width .9s}
.stk.l{left:calc(0px - var(--tl,0px));width:calc(var(--pw) + var(--tl,0px))}
.stk.r{left:var(--pw);width:calc(var(--pw) + var(--tr,0px))}
.bk.one .stk.l{left:calc(0px - var(--tl,0px))}

.lf{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);transform-origin:right center;transform-style:preserve-3d;transition:transform var(--ft,.9s) cubic-bezier(.45,.05,.55,.95) var(--dl,0s)}
.lf.fl{transform:rotateY(180deg)}
.lf.fly{animation:lfs var(--ft,.9s) var(--dl,0s) ease-in-out both}
@keyframes lfs{0%,100%{box-shadow:0 0 0 rgba(40,25,10,0)}50%{box-shadow:0 0 46px 4px rgba(40,25,10,.42)}}
.bk.one .lf.fl{visibility:hidden;transition:transform var(--ft,.9s) cubic-bezier(.45,.05,.55,.95) var(--dl,0s),visibility 0s linear calc(var(--dl,0s) + var(--ft,.9s))}

.fc{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:visibility 0s linear calc(var(--dl,0s) + var(--ft,.9s)/2)}
.fc.fr{border-radius:14px 0 0 14px}
.fc.bc{border-radius:0 14px 14px 0;transform:rotateY(180deg);visibility:hidden}
.lf.fl>.fr{visibility:hidden}
.lf.fl>.bc{visibility:inherit}
.fc:before,.fc:after{content:'';position:absolute;inset:0;pointer-events:none}
.fc:before{z-index:3}
.fr:before{background:linear-gradient(to left,rgba(70,45,20,.22),rgba(70,45,20,.07) 7%,transparent 16%)}

.fc:after{z-index:4;opacity:0;background:linear-gradient(to left,rgba(40,25,10,0),rgba(40,25,10,.5))}
.lf.fly .fc:after{animation:shd var(--ft,.9s) var(--dl,0s) ease-in-out both}
@keyframes shd{50%{opacity:1}100%{opacity:0}}
.fc.bp{background:var(--paper)}

.pb{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:22px 22px 50px 34px;scrollbar-width:thin;scrollbar-color:var(--latte) transparent}
.bc .pb{padding:22px 34px 50px 22px}
.pb:focus-visible{outline:2px solid var(--sky);outline-offset:-4px}
.fd{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:2;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--paper) 72%)}
.fo{position:absolute;left:0;right:0;bottom:9px;z-index:2;text-align:center;font:600 13px/1 Amiri;color:var(--soft);pointer-events:none}
.hn{position:absolute;left:50%;bottom:26px;z-index:2;width:18px;height:18px;margin-left:-9px;color:var(--latte);opacity:0;pointer-events:none;transition:opacity .3s;animation:bob 1.6s ease-in-out infinite}
.hn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fc.more .hn{opacity:.95}
@keyframes bob{50%{transform:translateY(4px)}}
.bk .page{animation:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
.bk .ayah{font-size:clamp(20px,calc(var(--pw)*.062),29px)}
.bk .sent{font-size:clamp(19px,calc(var(--pw)*.056),26px)}
.bk td,.bk th{white-space:normal}
.bk td:first-child,.bk td.w{white-space:normal;min-width:4.5em}

.fc.cv{color:#2b2118;background:radial-gradient(circle at 28% 12%,rgba(255,255,255,.3),transparent 46%),linear-gradient(150deg,#d6b88e,#c9a97e 48%,#b58f63)}
.cvf{position:absolute;inset:clamp(14px,calc(var(--pw)*.05),24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,calc(var(--ph)*.016),14px);padding:18px;text-align:center;border:1.5px solid rgba(251,246,236,.82);outline:1px solid rgba(251,246,236,.45);outline-offset:5px;border-radius:6px}
.orn{width:clamp(56px,calc(var(--pw)*.22),96px);height:auto;fill:none;stroke:#fbf6ec;stroke-width:1.6;opacity:.92}
.orn .fill{fill:#fbf6ec;stroke:none}
.ct{font:700 clamp(26px,calc(var(--pw)*.095),46px)/1.5 Amiri;color:#2b2118}
.cl{width:42%;height:1.5px;background:rgba(251,246,236,.85)}
.cs{font:600 clamp(13px,calc(var(--pw)*.034),16px)/1.9 'Noto Naskh Arabic';color:#3b2f24}
.cs.c1{font:700 clamp(18px,calc(var(--pw)*.058),27px)/1.7 Amiri}
.bl .frm{position:absolute;inset:18px;border:1px solid var(--line);border-radius:6px}
.bl .orn{position:absolute;left:50%;top:50%;width:64px;margin:-32px 0 0 -32px;stroke:var(--latte);opacity:.45;stroke-width:1.4}
.bl .orn .fill{fill:var(--latte)}

@media (prefers-reduced-motion:reduce){.bkov,.bkov.out{animation:none}.hn{animation:none}.bk,.stk{transition:none}}
</style>
<script>
/* ===================== وضع الكتاب ===================== */
(()=>{
'use strict';
const NP=48,DUR=.9,MAXA=7;
const q=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH={
 l:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
 d:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'};
const ORN='<svg class="orn" viewBox="0 0 100 100" aria-hidden="true"><rect x="24" y="24" width="52" height="52"/><rect x="24" y="24" width="52" height="52" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="4.5" class="fill"/></svg>';
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)');

const ov=document.createElement('div');
ov.className='bkov';ov.hidden=true;
ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','وضع الكتاب');
ov.innerHTML=
'<div class="bkbar"><div class="bkt" id="bkt"></div><div class="bkacts">'+
 '<button class="bkb" id="bkdrill" aria-pressed="false">وضع التدريب</button>'+
 '<button class="bkb" id="bkclose">إغلاق</button></div></div>'+
'<div class="bkstage" id="bkstage">'+
 '<button class="bkarr bkprev" id="bkprev" aria-label="الصفحة السابقة">'+CH.r+'</button>'+
 '<div class="bk" id="bk"></div>'+
 '<button class="bkarr bknext" id="bknext" aria-label="الصفحة التالية">'+CH.l+'</button></div>'+
'<div class="bkfoot"><button class="bkb" id="bkp">'+CH.r+'<span>السابق</span></button>'+
 '<div class="bkmid"><select class="bksel" id="bksel" aria-label="الانتقال إلى آية"></select><span class="bkinfo" id="bkinfo" aria-live="polite"></span></div>'+
 '<button class="bkb" id="bkn"><span>التالي</span>'+CH.l+'</button></div>';
document.body.appendChild(ov);
const $o=s=>ov.querySelector(s);
const bk=$o('#bk'),stage=$o('#bkstage'),sel=$o('#bksel'),info=$o('#bkinfo');
const prevBs=[$o('#bkprev'),$o('#bkp')],nextBs=[$o('#bknext'),$o('#bkn')];
sel.innerHTML='<option value="c">الغلاف</option>'+V.map((_,i)=>`<option value="${i}">الآية ${ar(i+1)}</option>`).join('');

let spread=true,built=null,N=26,maxPos=26,pos=0,pw=0,ph=0,leaves=[];
let busy=0,tm=0,rt=0,lastFocus=null,closing=false;
const bgEls=()=>[...document.body.children].filter(e=>e!==ov);

function coverHTML(){
 const t=q('h1').textContent.trim();
 const subs=[...document.querySelectorAll('header .sub')].map(e=>e.textContent.trim());
 return `<div class="cvf">${ORN}<div class="ct">${esc(t)}</div><div class="cl"></div>${subs.map((s,i)=>`<div class="cs${i?'':' c1'}">${esc(s)}</div>`).join('')}</div>`;
}
const backHTML=()=>`<div class="cvf">${ORN}</div>`;
const blankHTML=()=>`<div class="frm"></div>${ORN}`;
function pageFace(pi){
 return `<div class="pb" tabindex="0">${page(Math.floor(pi/3),pi%3)}</div><div class="fd"></div><div class="hn">${CH.d}</div><div class="fo">${ar(pi+1)}</div>`;
}
function spec(face){
 if(face===0)return['cv',coverHTML()];
 if(face===1||face===50)return['bl',blankHTML()];
 if(face===51)return['cv',backHTML()];
 return['pgf',pageFace(face-2)];
}
function build(key){
 built=key;spread=key==='sp';
 N=spread?26:50;maxPos=spread?N:N-1;pos=0;
 bk.className='bk '+key;
 let h='<div class="stk l"></div>'+(spread?'<div class="stk r"></div>':'');
 for(let k=0;k<N;k++){
  let a,b;
  if(spread){a=spec(2*k);b=spec(2*k+1)}
  else{a=k===0?['cv',coverHTML()]:k===N-1?['cv',backHTML()]:['pgf',pageFace(k-1)];b=['bp','']}
  h+=`<div class="lf" style="z-index:${N-k+1}"><div class="fc fr ${a[0]}">${a[1]}</div><div class="fc bc ${b[0]}">${b[1]}</div></div>`;
 }
 bk.innerHTML=h;
 leaves=[...bk.querySelectorAll('.lf')];
 bindContent();
}
function bindContent(){
 bind();
 bk.querySelectorAll('td+td').forEach(td=>td.onclick=()=>td.classList.toggle('on'));
 bk.querySelectorAll('.pb').forEach(pb=>pb.addEventListener('scroll',()=>more(pb),{passive:true}));
}
function more(pb){pb.parentElement.classList.toggle('more',pb.scrollHeight-pb.scrollTop-pb.clientHeight>8)}
function updateMore(){bk.querySelectorAll('.pb').forEach(more)}

function measure(){
 const r=stage.getBoundingClientRect();
 const side=r.width>=900?66:8;
 const aw=Math.max(240,r.width-2*side),ah=Math.max(260,r.height-14);
 spread=aw>=820&&ah>=420;
 let w,h=ah;
 if(spread){w=aw/2;if(w/h>.8)w=h*.8;else if(w/h<.62)h=w/.62}
 else w=Math.min(aw,Math.max(h*.8,Math.min(aw,520)));
 pw=Math.floor(w);ph=Math.floor(h);
}
function layout(force,pi0){
 measure();
 bk.style.setProperty('--pw',pw+'px');bk.style.setProperty('--ph',ph+'px');
 const key=spread?'sp':'one';
 if(force||key!==built){
  const pi=pi0!==undefined?pi0:piOf();
  build(key);
  go(posOf(pi),false);
 }else settle();
}

function piOf(){
 if(pos<=0)return -1;
 if(spread){const r=2*pos-3;return r>=0?Math.min(r,NP-1):0}
 return Math.min(pos-1,NP-1);
}
function posOf(pi){
 if(pi<0)return 0;
 return spread?(pi%2===0?pi/2+1:(pi+3)/2):pi+1;
}
const zRest=k=>k<pos?k+1:N-k+1;
function win(p,set){for(let k=p-2;k<=p+2;k++)if(k>=0&&k<N)set.add(k);return set}

function go(np,animate){
 np=Math.max(0,Math.min(maxPos,np));
 const old=pos;
 if(np!==old){
  pos=np;
  const fwd=np>old,lo=Math.min(old,np),hi=Math.max(old,np),ks=[];
  for(let k=lo;k<hi;k++)ks.push(k);
  if(!fwd)ks.reverse();
  const m=ks.length;
  const A=(animate&&!REDUCE.matches)?Math.min(m,MAXA):0;
  const stag=A>1?Math.min(130,950/(A-1)):0;
  const want=new Set();win(old,want);win(np,want);
  ks.forEach((k,i)=>{if(i>=m-A)want.add(k)});
  leaves.forEach((l,k)=>{l.style.display=want.has(k)?'':'none'});
  void bk.offsetWidth;
  ks.forEach((k,i)=>{
   const l=leaves[k],j=i-(m-A),an=j>=0;
   l.style.setProperty('--ft',an?DUR+'s':'0s');
   l.style.setProperty('--dl',an?(j*stag/1000).toFixed(3)+'s':'0s');
   l.style.zIndex=an?200+(fwd?k:N-k):zRest(k);
   l.classList.toggle('fl',k<np);
   if(an){l.classList.remove('fly');void l.offsetWidth;l.classList.add('fly')}
  });
  if(A)busy=Math.max(busy,performance.now()+(DUR+(A-1)*stag/1000)*1000+80);
 }
 settle();
 clearTimeout(tm);
 tm=setTimeout(cleanup,Math.max(0,busy-performance.now())+30);
}
function cleanup(){
 if(performance.now()<busy-20){tm=setTimeout(cleanup,busy-performance.now()+30);return}
 leaves.forEach((l,k)=>{l.style.zIndex=zRest(k);l.classList.remove('fly')});
 const want=win(pos,new Set());
 leaves.forEach((l,k)=>{l.style.display=want.has(k)?'':'none'});
 updateMore();
}
function settle(){
 let sx=0;
 if(spread){if(pos===0)sx=pw/2;else if(pos===N)sx=-pw/2}
 bk.style.transform=sx?`translateX(${sx}px)`:'';
 bk.style.setProperty('--tl',((spread?(N-pos)/N:(maxPos-pos)/maxPos)*(spread?13:8)).toFixed(1)+'px');
 bk.style.setProperty('--tr',(spread?pos/N*13:0).toFixed(1)+'px');
 prevBs.forEach(b=>b.disabled=pos<=0);
 nextBs.forEach(b=>b.disabled=pos>=maxPos);
 const pi=piOf();
 if(pi>=0){cur=Math.floor(pi/3);pg=pi%3;seen.add(cur)}
 sel.value=pos===0?'c':String(cur);
 let t;
 if(pos===0)t='الغلاف';
 else if(pos>=N&&spread||!spread&&pos===maxPos)t='نهاية الكتاب';
 else if(spread){
  const nr=2*pos-2,nl=2*pos-1,ok=[nr,nl].filter(n=>n>=1&&n<=NP);
  t=ok.length===2?`الصفحتان ${ar(ok[0])} – ${ar(ok[1])} من ${ar(NP)}`:`الصفحة ${ar(ok[0])} من ${ar(NP)}`;
 }else t=`الصفحة ${ar(pos)} من ${ar(NP)}`;
 info.textContent=t;
 const vis=new Set();
 if(spread){
  if(leaves[pos-1])vis.add(leaves[pos-1].querySelector('.bc'));
  if(leaves[pos])vis.add(leaves[pos].querySelector('.fr'));
 }else if(leaves[pos])vis.add(leaves[pos].querySelector('.fr'));
 bk.querySelectorAll('.fc').forEach(f=>{f.inert=!vis.has(f)});
}
const next=()=>go(pos+1,true),prev=()=>go(pos-1,true);

function openBook(){
 if(!ov.hidden||closing)return;
 lastFocus=document.activeElement;
 ov.hidden=false;ov.classList.remove('out');
 document.body.classList.add('bkopen');
 bgEls().forEach(e=>e.inert=true);
 $o('#bkt').textContent=q('h1').textContent.trim();
 $o('#bkdrill').setAttribute('aria-pressed',document.body.classList.contains('drill'));
 layout(true,(cur===0&&pg===0)?-1:cur*3+pg);
 $o('#bkclose').focus();
}
function closeBook(){
 if(ov.hidden||closing)return;
 closing=true;ov.classList.add('out');
 setTimeout(()=>{
  ov.hidden=true;ov.classList.remove('out');
  document.body.classList.remove('bkopen');
  bgEls().forEach(e=>e.inert=false);
  closing=false;
  render();
  try{lastFocus&&lastFocus.focus()}catch(_){}
 },230);
}

q('#bkb').onclick=openBook;
$o('#bkclose').onclick=closeBook;
prevBs.forEach(b=>b.onclick=prev);
nextBs.forEach(b=>b.onclick=next);
sel.onchange=()=>go(sel.value==='c'?0:posOf(+sel.value*3),true);
$o('#bkdrill').onclick=e=>{q('#drill').click();e.currentTarget.setAttribute('aria-pressed',document.body.classList.contains('drill'))};

addEventListener('keydown',e=>{
 if(ov.hidden)return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeBook();return}
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const k=e.key;
 if(k==='ArrowLeft'||k==='ArrowRight'){
  e.stopImmediatePropagation();
  if(e.target&&e.target.tagName==='SELECT')return;
  e.preventDefault();
  k==='ArrowLeft'?next():prev();
 }else if((k==='Home'||k==='End')&&!(e.target&&e.target.closest&&e.target.closest('.pb'))){
  e.preventDefault();go(k==='Home'?0:maxPos,true);
 }
},true);

let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
stage.addEventListener('touchend',e=>{
 if(!tx)return;
 const t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;tx=null;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6)dx>0?next():prev();
},{passive:true});

const onResize=()=>{if(ov.hidden)return;clearTimeout(rt);rt=setTimeout(()=>layout(false),120)};
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!ov.hidden)updateMore()});
})();
</script>
</body>
</html>
